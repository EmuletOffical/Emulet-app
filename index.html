<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emulet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3d8fe0">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emulet">
<style>
:root{--bg:#f6f1e3;--fg:#141414;--card:#cfcfe0;--btn:#3d8fe0;--btnfg:#fff;--ink:#141414;--screen:#141414;--accL:#8ed2ff;--accD:#2a6fc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a22;--fg:#f3efe3}}
:root[data-theme="dark"]{--bg:#1b1a22;--fg:#f3efe3}
h1,h2,.brand,.hero h2,.tab,.seg,.k,.b,button,.chip{font-family:'Kalam',var(--sysfont,system-ui),sans-serif}
:root[data-theme="dark"]{--bg:#15171a;--fg:#e8e6df;--card:#2a2d31;--btn:#b8416a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;min-height:100vh;touch-action:manipulation}
h1{font-size:18px;margin:0}
#screen{width:min(100%,480px);aspect-ratio:160/144;image-rendering:pixelated;background:#9bbc0f;border:10px solid var(--card);border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
label.b,button{background:var(--btn);color:var(--btnfg);border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
#st{font-size:13px;opacity:.75}
#pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.k{background:var(--card);color:var(--fg);border-radius:10px;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;font-weight:700}
.k.r{border-radius:50%;width:64px;height:64px}
#ctl{display:flex;gap:28px;align-items:center;justify-content:center;width:100%;flex-wrap:wrap}
.hide{display:none!important}
